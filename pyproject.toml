[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisbench"
version = "0.2.0"
description = "A reproducible benchmark for secure multi-agent LLM serving in distributed clouds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shivam Kumar" }]
keywords = ["llm-serving", "multi-agent", "inference", "benchmark", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
paper = [
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
aegisbench = "aegisbench.cli:main"

[project.urls]
Homepage = "https://github.com/shivam2003-dev/secure-multi-agent-llm-serving"
Repository = "https://github.com/shivam2003-dev/secure-multi-agent-llm-serving"
Issues = "https://github.com/shivam2003-dev/secure-multi-agent-llm-serving/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisbench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
